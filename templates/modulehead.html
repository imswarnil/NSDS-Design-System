<!-- Module head — the header of one module's page.

     The crumb states position in words ("Module 2 of 8"), not just a number,
     so it still means something read aloud out of context.

     Framework-agnostic markup: the same .ns-* classes the React side renders.
     Ghost: paste into a partial. Next.js: prefer the component. -->

<header class="ns-modulehead">
  <span class="ns-modulehead__crumb">Salesforce Administrator · Module 2 of 8</span>
  <h1 class="ns-modulehead__title">Security and access</h1>
  <p class="ns-modulehead__lede">Profiles, permission sets, roles and sharing — in that order, because each one only makes sense given the last.</p>
</header>
