<!-- Divider — a rule between things, and the one component that is nothing but
     the hairline. The labelled form's text is real text between two rules, so
     it survives selection and copy.

     Framework-agnostic markup: the same .ns-* classes the styleguide renders.
     Ghost: paste into a partial. Next.js: prefer the React component. -->

<p class="ns-card__text">Above the rule.</p>
<hr class="ns-divider">
<p class="ns-card__text">Below it.</p>

<div class="ns-divider ns-divider--labelled">or</div>

<p class="ns-card__text">Above.</p>
<hr class="ns-divider ns-divider--tight">
<p class="ns-card__text">Below.</p>
