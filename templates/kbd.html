<!-- Kbd — a key, and sequences of keys.

     The separator is content, not a ::before: "+" means pressed together and
     "then" means pressed in turn, and those are different instructions.

     Framework-agnostic markup: the same .ns-* classes the styleguide renders.
     Ghost: paste into a partial. Next.js: prefer the React component. -->

<span class="ns-kbd-seq"><kbd class="ns-kbd">⌘</kbd><span class="ns-kbd-seq__sep">+</span><kbd class="ns-kbd">K</kbd></span>
<span class="ns-kbd-seq"><kbd class="ns-kbd">Ctrl</kbd><span class="ns-kbd-seq__sep">+</span><kbd class="ns-kbd">Shift</kbd><span class="ns-kbd-seq__sep">+</span><kbd class="ns-kbd">P</kbd></span>

<span class="ns-kbd-seq"><kbd class="ns-kbd">G</kbd><span class="ns-kbd-seq__sep">then</span><kbd class="ns-kbd">D</kbd></span>
