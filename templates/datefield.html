<!-- Date field — native <input type="date">, styled to match .ns-input.

     Deliberately not a custom calendar: the platform picker is localised,
     keyboard-operable, and is the one the reader's phone already shows.

     Framework-agnostic markup: the same .ns-* classes the styleguide renders.
     Ghost: paste into a partial. Next.js: prefer the React component. -->

<div class="ns-datefield"><input class="ns-input" type="date" aria-label="Publish date"></div>
<div class="ns-datefield"><input class="ns-input" type="date" value="2026-09-14" aria-label="Cohort start"></div>

<div class="ns-field">
  <label class="ns-field__label" for="d-pub">Publish date</label>
  <div class="ns-datefield"><input class="ns-input" id="d-pub" type="date" value="2026-09-14"></div>
  <p class="ns-field__help">Scheduled posts go live at 09:00 in the site timezone.</p>
</div>
