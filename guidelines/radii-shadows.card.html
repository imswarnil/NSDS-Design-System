<!-- @dsCard group="Foundations" viewport="700x160" name="Radius & Border-as-Elevation" subtitle="6px card / 4px button radius — the hairline border does the work shadows used to" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface);display:flex;gap:16px;font-family:var(--font-mono);font-size:11px;color:var(--color-label);text-transform:uppercase;letter-spacing:.06em}
.b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:100%;height:70px;background:var(--color-surface-raised)}
</style></head><body>
<div class="b"><div class="box" style="border-radius:var(--radius-card);box-shadow:inset 0 0 0 1px var(--color-border)"></div>radius-card 6px</div>
<div class="b"><div class="box" style="border-radius:var(--radius-btn);box-shadow:inset 0 0 0 1px var(--color-brand-500)"></div>radius-btn 4px + hover border</div>
<div class="b"><div class="box" style="border-radius:var(--radius-pill);background:var(--color-brand-500)"></div>radius-pill (tags only)</div>
</body></html>
