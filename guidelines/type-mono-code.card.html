<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface)}
.ns-code{border-radius:8px;overflow:hidden;border:1px solid #d8dde6;box-shadow:0 12px 32px -14px rgba(3,45,96,.28)}
.bar{background:#032d60;padding:8px 12px 0;display:flex;justify-content:space-between;align-items:flex-end}
.tab{background:#fff;color:#0176d3;font-size:12px;font-weight:700;border-radius:6px 6px 0 0;padding:6px 12px}
pre{margin:0;background:#fff;padding:14px;font-family:var(--font-mono);font-size:13px;color:#16325c;overflow-x:auto}
</style></head><body>
<div class="ns-code"><div class="bar"><span class="tab">apex</span></div>
<pre>public class GreetingService {
  public static String greet(String name) {
    return 'Hello, ' + name + '!';
  }
}</pre></div>
</body></html>
