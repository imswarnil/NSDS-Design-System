<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Surface & Ink" subtitle="Light mode — flips automatically under data-theme=dark" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface);font-family:var(--font-sans)}
.row{display:flex;gap:10px}
.sw{flex:1;height:80px;border-radius:10px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:700;font-family:var(--font-mono);border:1px solid var(--color-border)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--color-surface);color:var(--color-ink)">surface</div>
<div class="sw" style="background:var(--color-surface-raised);color:var(--color-ink)">surface-raised</div>
<div class="sw" style="background:var(--color-surface-sunken);color:var(--color-ink)">surface-sunken</div>
<div class="sw" style="background:var(--color-ink);color:var(--color-surface);border:none">ink</div>
<div class="sw" style="background:var(--color-muted);color:#fff;border:none">muted</div>
</div>
</body></html>
