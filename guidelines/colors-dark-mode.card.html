<!-- @dsCard group="Colors" viewport="700x150" name="Dark Mode = Brand Navy" subtitle="data-theme=\"dark\" — surfaces built from brand-800/900, not a generic slate" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;display:flex;font-family:var(--font-sans)}
.half{flex:1;height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
</style></head><body>
<div class="half" data-theme="light" style="background:var(--ns-surface);color:var(--ns-ink)">
<b>Light</b><span style="font-size:12px;color:var(--ns-muted);font-family:var(--font-mono)">surface #ffffff · ink #181818</span></div>
<div class="half" data-theme="dark" style="background:var(--ns-surface);color:var(--ns-ink)">
<b>Dark</b><span style="font-size:12px;color:var(--ns-muted);font-family:var(--font-mono)">surface #051222 · ink #eaf2fb</span></div>
</body></html>
