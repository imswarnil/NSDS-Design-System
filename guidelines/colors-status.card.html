<!-- @dsCard group="Colors" viewport="700x120" name="Status Colors" subtitle="Success / Warning / Error — used sparingly, one mark at a time" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../dist/namaste-ui.tailwind.css"><title>Status Colors</title></head>
<body class="m-0 p-5 bg-surface font-sans flex gap-row">
<div class="flex-1 h-[70px] rounded-card flex flex-col items-center justify-center gap-1 font-semibold text-small text-success" style="background:color-mix(in srgb, var(--color-success) 12%, transparent)">Success<span class="font-mono text-data font-regular">#2E844A</span></div>
<div class="flex-1 h-[70px] rounded-card flex flex-col items-center justify-center gap-1 font-semibold text-small text-warning-ink" style="background:color-mix(in srgb, var(--color-warning) 16%, transparent)">Warning<span class="font-mono text-data font-regular">#FE9339</span></div>
<div class="flex-1 h-[70px] rounded-card flex flex-col items-center justify-center gap-1 font-semibold text-small text-error" style="background:color-mix(in srgb, var(--color-error) 12%, transparent)">Error<span class="font-mono text-data font-regular">#EA001E</span></div>
</body></html>
