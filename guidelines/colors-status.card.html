<!-- @dsCard group="Colors" viewport="700x140" name="Status Colors" subtitle="Success / Warning / Error — used sparingly, one mark at a time" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface);font-family:var(--font-sans);display:flex;gap:14px}
.pill{flex:1;height:70px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:13px}
</style></head><body>
<div class="pill" style="background:color-mix(in srgb, var(--color-success) 12%, transparent);color:var(--color-success)">Success<span style="font-family:var(--font-mono);font-size:11px;font-weight:400">#2E844A</span></div>
<div class="pill" style="background:color-mix(in srgb, var(--color-warning) 16%, transparent);color:#8a5a00">Warning<span style="font-family:var(--font-mono);font-size:11px;font-weight:400">#FE9339</span></div>
<div class="pill" style="background:color-mix(in srgb, var(--color-error) 12%, transparent);color:var(--color-error)">Error<span style="font-family:var(--font-mono);font-size:11px;font-weight:400">#EA001E</span></div>
</body></html>
