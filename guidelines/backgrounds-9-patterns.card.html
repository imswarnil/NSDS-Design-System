<!-- @dsCard group="Brand" viewport="700x580" name="9 Background Patterns" subtitle="Abstract, geometric, hairline-only — patterns/patterns.css, dark + light variants for hero canvases and collection thumbnails" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;background:var(--color-surface)}
h2{font-family:var(--font-mono);font-size:10px;color:var(--color-muted);text-transform:uppercase;letter-spacing:.08em;margin:0;padding:8px 8px 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--color-border)}
.p{aspect-ratio:16/10;overflow:hidden}
.p.dark{background:var(--color-brand-900)}
.p.light{background:#fff;box-shadow:inset 0 0 0 1px var(--color-border)}
.p span{position:absolute;bottom:6px;left:8px;font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.p.dark span{color:rgb(255 255 255/.5)}
.p.light span{color:rgb(0 0 0/.4)}
</style></head><body>
<h2>Dark · ns-pattern--&lt;name&gt;</h2>
<div class="grid" id="dark"></div>
<h2>Light · add ns-pattern--on-light</h2>
<div class="grid" id="light"></div>
<script>
/* The patterns are real classes in patterns/patterns.css — this card only
   lays them out, so the specimen cannot drift from the shipped file. */
const names=["grid","dots","diagonal","hex","concentric","chevron-grid","blueprint","topographic","dashed-path"];
for(const theme of ["dark","light"]){
  const el=document.getElementById(theme);
  names.forEach((n,i)=>{
    el.insertAdjacentHTML("beforeend",
      `<div class="p ${theme} ns-pattern ns-pattern--${n}${theme==="light"?" ns-pattern--on-light":""}"><span>${String(i+1).padStart(2,"0")} ${n}</span></div>`);
  });
}
</script>
</body></html>
