<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>NSDS live — action chips</title>
<link rel="stylesheet" href="../../../dist/namaste-ui.tailwind.css">
<link rel="stylesheet" href="overlay.css">
</head><body>
<!-- The asks: subscribe, like, bell, newsletter, visit, share — plus the CTA
     sting. Bind this source's visibility to a hotkey and let it expire on its
     own; a chip lane with no exit rule is wallpaper.

     ?chips=subscribe,bell&hold=8&theme=dark
     ?sting=Full%20course%20%2B%20notes&where=namastesalesforce.com/apex&hold=6 -->
<div class="ov-chips" id="chips"></div>
<div id="sting"></div>
<script>
  const q = new URLSearchParams(location.search), p = (k, d) => q.get(k) ?? d;
  document.documentElement.dataset.theme = p("theme", "dark");
  if (p("safe")) document.body.insertAdjacentHTML("beforeend", '<div class="ov-guide"></div>');

  const CHIPS = {
    subscribe:  ["ph-play-circle",    "Subscribe",             true],
    like:       ["ph-heart",          "Like if this helped",   false],
    bell:       ["ph-bell-ringing",   "All notifications",     false],
    newsletter: ["ph-envelope-simple","Newsletter",            false],
    site:       ["ph-globe",          "namastesalesforce.com", false],
    share:      ["ph-share-network",  "Share this",            false],
  };

  /* Two chips maximum, and at most one filled: a viewer who has to choose
     between five destinations goes to none of them. */
  const want = p("chips", "").split(",").filter((k) => CHIPS[k]).slice(0, 2);
  let filled = false;
  chips.innerHTML = want.map((k) => {
    const [icon, label, fill] = CHIPS[k];
    const solid = fill && !filled; if (solid) filled = true;
    return `<span class="ov-chip${solid ? " ov-chip--fill" : ""} ov-enter-left"><i class="ph ${icon}"></i>${label}</span>`;
  }).join("");

  if (q.get("sting")) {
    sting.innerHTML = `<div class="ov-sting ov-enter-left">
        <i class="ph ph-bell-ringing"></i>
        <div><b>${p("sting")}</b><span>${p("where", "namastesalesforce.com")}</span></div>
      </div>`;
  }

  const hold = Number(p("hold", q.get("sting") ? 6 : 8));
  if (hold > 0) setTimeout(() => {
    document.querySelectorAll(".ov-enter-left").forEach((el) => {
      el.className = el.className.replace("ov-enter-left", "ov-exit-left");
    });
  }, hold * 1000);
</script>
</body></html>
