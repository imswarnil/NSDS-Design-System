<!-- @dsCard group="Content Creation" viewport="700x800" name="YouTube End Screen — Dark + Light" subtitle="Last-20-seconds layout — next video, subscribe circle, website card" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../dist/namaste-ui.tailwind.css">
<style>body{margin:0;padding:16px;background:var(--color-surface);font-family:var(--font-sans)}
.label{font-family:var(--font-mono);font-size:10px;color:var(--color-muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.card{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden}
.dark{background:var(--color-brand-900);color:#fff}
.light{background:#fff;color:var(--color-brand-900);box-shadow:inset 0 0 0 1px var(--color-border)}
.bar{position:absolute;top:0;left:0;right:0;height:4px;background:var(--color-brand-500)}
.pat{position:absolute;inset:0}
.next{position:absolute;left:5%;top:14%;width:38%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.dark .next{background:rgb(255 255 255/.08);border:1px solid rgb(255 255 255/.2)}
.light .next{background:var(--color-surface-sunken);border:1px solid var(--color-border)}
.next i{font-size:20px;color:var(--color-brand-500)}
.next span{font-family:var(--font-mono);font-size:9px;text-align:center;padding:0 8px}
.dark .next span{color:rgb(255 255 255/.7)}
.light .next span{color:var(--color-muted)}
.sub{position:absolute;right:8%;top:12%;width:76px;height:76px;border-radius:50%;background:var(--color-brand-500);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
.sub i{font-size:20px}
.sub span{font-family:var(--font-mono);font-size:8px;font-weight:700}
.site{position:absolute;left:5%;bottom:10%;width:60%;border-radius:2px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.dark .site{background:rgb(255 255 255/.08);border:1px solid rgb(255 255 255/.2)}
.light .site{background:var(--color-surface-sunken);border:1px solid var(--color-border)}
.site i{font-size:16px;color:var(--color-brand-500)}
.site div{font-family:var(--font-mono);font-size:9px}
.site b{display:block;font-size:10px;font-family:var(--font-heading)}
.dark .site div{color:rgb(255 255 255/.7)}
.light .site div{color:var(--color-muted)}
</style></head><body>
<div class="label">Dark</div>
<div class="card dark"><div class="bar"></div><div class="pat" style="background-image:linear-gradient(to right,rgb(255 255 255/.06) 1px,transparent 1px),linear-gradient(to bottom,rgb(255 255 255/.06) 1px,transparent 1px);background-size:24px 24px"></div>
<div class="next"><i class="ph ph-play-circle"></i><span>Bulkification &amp; Governor Limits</span></div>
<div class="sub"><i class="ph ph-bell-ringing"></i><span>SUBSCRIBE</span></div>
<div class="site"><i class="ph ph-globe"></i><div><b>namastesalesforce.com</b>Full course + resources</div></div>
</div>
<div class="label">Light</div>
<div class="card light"><div class="bar"></div><div class="pat" style="background-image:linear-gradient(to right,rgb(0 0 30/.05) 1px,transparent 1px),linear-gradient(to bottom,rgb(0 0 30/.05) 1px,transparent 1px);background-size:24px 24px"></div>
<div class="next"><i class="ph ph-play-circle"></i><span>Bulkification &amp; Governor Limits</span></div>
<div class="sub"><i class="ph ph-bell-ringing"></i><span>SUBSCRIBE</span></div>
<div class="site"><i class="ph ph-globe"></i><div><b>namastesalesforce.com</b>Full course + resources</div></div>
</div>
</body></html>
