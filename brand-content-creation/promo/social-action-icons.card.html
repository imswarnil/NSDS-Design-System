<!-- @dsCard group="Content Creation" viewport="700x260" name="Social Action Icons" subtitle="Subscribe, share, like, comment, save — mono-ring tiles, consistent with component Chip style" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface);display:flex;gap:14px;flex-wrap:wrap}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;width:74px}
.icn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 0 0 1px var(--color-border);color:var(--color-brand-600)}
.icn.fill{background:var(--color-brand-500);color:#fff;box-shadow:none}
.lbl{font-family:var(--font-mono);font-size:9px;color:var(--color-muted);text-transform:uppercase;letter-spacing:.04em}
</style></head><body>
<div class="tile"><div class="icn fill"><i class="ph ph-bell-ringing"></i></div><span class="lbl">Subscribe</span></div>
<div class="tile"><div class="icn"><i class="ph ph-heart"></i></div><span class="lbl">Like</span></div>
<div class="tile"><div class="icn"><i class="ph ph-chat-circle"></i></div><span class="lbl">Comment</span></div>
<div class="tile"><div class="icn"><i class="ph ph-share-network"></i></div><span class="lbl">Share</span></div>
<div class="tile"><div class="icn"><i class="ph ph-bookmark-simple"></i></div><span class="lbl">Save</span></div>
<div class="tile"><div class="icn"><i class="ph ph-link-simple"></i></div><span class="lbl">Copy link</span></div>
</body></html>
