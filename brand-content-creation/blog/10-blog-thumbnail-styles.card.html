<!-- @dsCard group="Content Creation" viewport="700x2055" name="10 Blog Thumbnail Styles — Dark + Light" subtitle="Rotating layouts, each with a category icon" -->
<!-- px-ok: this card draws MINIATURES of 1920x1080 frames and thumbnails, so the
     type inside a tile is scaled artwork, not UI copy — a scale token there would
     be the wrong size by definition. The card's own chrome (labels, captions) does
     use the scale. See improve.md IMPROVE-11. -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../dist/namaste-ui.tailwind.css">
<style>body{margin:0;padding:14px;background:var(--color-surface);font-family:var(--font-sans)}
.label{font-family:var(--font-mono);font-size:var(--size-label);color:var(--color-muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.t{aspect-ratio:16/9;position:relative;overflow:hidden}
.dark{background:var(--color-brand-900);color:#fff}
.light{background:#fff;color:var(--color-brand-900);box-shadow:inset 0 0 0 1px var(--color-border)}
.bar{position:absolute;top:0;left:0;right:0;height:3px;background:var(--color-brand-500)}
.lbl{position:absolute;bottom:5px;left:8px;font-family:var(--font-mono);font-size:8px;text-transform:uppercase;z-index:2}
.dark .lbl{color:rgb(255 255 255/.45)}
.light .lbl{color:var(--color-muted)}
.tag{position:absolute;top:8px;left:8px;font-family:var(--font-mono);font-size:8px;background:var(--color-brand-500);color:#fff;padding:2px 6px 2px 20px;border-radius:2px;display:flex;align-items:center;gap:4px}
.tag i{position:absolute;left:6px;font-size:9px}
.tt{position:absolute;left:8px;right:8px;top:28px;font-family:var(--font-heading);font-weight:700;font-size:12px;line-height:1.2}
.by{position:absolute;left:8px;bottom:16px;font-family:var(--font-mono);font-size:7px}
.dark .by{color:rgb(255 255 255/.55)}
.light .by{color:var(--color-muted)}
</style></head><body>
<div class="label">Dark</div><div class="grid" id="d"></div>
<div class="label">Light</div><div class="grid" id="l"></div>
<script>
const posts=[
["Grid pattern","ph-hammer","linear-gradient(to right,{c} 1px,transparent 1px),linear-gradient(to bottom,{c} 1px,transparent 1px)","20px 20px","Engineering","Why We Rebuilt the Training Roadmap"],
["Dot pattern","ph-briefcase","radial-gradient({c} 1px,transparent 1px)","12px 12px","Careers","From Bootcamp to Salesforce Architect"],
["Diagonal","ph-users-three","repeating-linear-gradient(45deg,{c} 0 1px,transparent 1px 10px)",null,"Community","Trailblazer Spotlight: Priya Sharma"],
["Concentric","ph-rocket-launch","radial-gradient(circle,transparent 0 8px,{c} 9px 10px,transparent 11px)","60px 60px","Product","Introducing Dark Mode"],
["Chevron-grid","ph-book-open-text","repeating-linear-gradient(90deg,{c} 0 5px,transparent 5px 14px),repeating-linear-gradient(0deg,{c} 0 5px,transparent 5px 14px)",null,"Tutorial","Debugging Apex with Query Plans"],
["Blueprint","ph-megaphone","linear-gradient(to right,{c} 1px,transparent 1px)","12px 100%","News","Winter '27 Release Highlights"],
["Topographic","ph-chat-centered-text","radial-gradient({c} 1.5px,transparent 1.5px)","9px 9px","Opinion","SLDS vs Tailwind: A Fair Comparison"],
["Hex","ph-buildings","linear-gradient(30deg,{c} 1px,transparent 1px),linear-gradient(150deg,{c} 1px,transparent 1px)","22px 38px","Architecture","Designing for Governor Limits"],
["Dashed path","ph-map-trifold","repeating-linear-gradient(to bottom,{c2} 0 2px,transparent 2px 8px)",null,"Guide","A Beginner's Map of the Platform"],
["No pattern (quote)","ph-quotes","none",null,"Interview","\u201CTest first, ship confidently.\u201D"]
];
function render(id,theme){
  const w=theme==="dark"?"255 255 255":"0 0 30";
  const boost=theme==="dark"?1:1.5;
  const g=document.getElementById(id);
  posts.forEach(([label,icon,img,size,tag,title])=>{
    const c=`rgb(${w}/${.08*boost})`,c2=`rgb(${w}/${.16*boost})`;
    const pat = img!=="none" ? img.replaceAll("{c}",c).replaceAll("{c2}",c2) : "";
    const patStyle = pat ? `background-image:${pat};${size?`background-size:${size}`:''}` : '';
    g.insertAdjacentHTML('beforeend',`<div class="t ${theme}"><div class="bar"></div><div style="position:absolute;inset:0;${patStyle}"></div><div class="tag"><i class="ph ${icon}"></i>${tag}</div><div class="tt">${title}</div><div class="by">Priya Sharma · Jul 12 · 6 min</div><span class="lbl">${label}</span></div>`);
  });
}
render("d","dark");render("l","light");
</script>
</body></html>
