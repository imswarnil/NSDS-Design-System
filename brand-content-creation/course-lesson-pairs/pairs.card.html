<!-- @dsCard group="Content Creation" viewport="700x1695" name="Course + Lesson Pairs — Dark + Light" subtitle="5 pairs × 2 themes; each course icon carries through to its lesson" -->
<!-- px-ok: this card draws MINIATURES of 1920x1080 frames and thumbnails, so the
     type inside a tile is scaled artwork, not UI copy — a scale token there would
     be the wrong size by definition. The card's own chrome (labels, captions) does
     use the scale. See improve.md IMPROVE-11. -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../dist/nsds.tailwind.css">
<style>body{margin:0;padding:16px;background:var(--color-surface);font-family:var(--font-sans)}
.label{font-family:var(--font-mono);font-size:var(--size-label);color:var(--color-muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.pair{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.card{width:260px;aspect-ratio:16/9;position:relative;overflow:hidden;flex-shrink:0}
.dark{background:var(--color-brand-900);color:#fff}
.light{background:#fff;color:var(--color-brand-900);box-shadow:inset 0 0 0 1px var(--color-border)}
.bar{position:absolute;top:0;left:0;right:0;height:4px;background:var(--color-brand-500)}
.k{position:absolute;top:10px;left:26px;font-family:var(--font-mono);font-size:8px;text-transform:uppercase}
.dark .k{color:var(--color-brand-300)}
.light .k{color:var(--color-brand-600)}
.k::before{content:"// "}
.ic{position:absolute;top:9px;left:10px;font-size:11px}
.dark .ic{color:var(--color-brand-300)}
.light .ic{color:var(--color-brand-500)}
.tt{position:absolute;left:10px;right:10px;bottom:18px;font-family:var(--font-heading);font-weight:700;font-size:13px;line-height:1.15}
.idx{position:absolute;right:10px;bottom:14px;font-family:var(--font-mono);font-weight:700;font-size:20px}
.dark .idx{color:rgb(255 255 255/.18)}
.light .idx{color:rgb(0 0 30/.12)}
.arrow{font-family:var(--font-mono);color:var(--color-muted);font-size:14px}
</style></head><body>
<div class="label">Dark</div><div id="d"></div>
<div class="label">Light</div><div id="l"></div>
<script>
const pairs=[
["ph-shield-check","Admin","Salesforce Admin Basics","Managing Users & Profiles","03","linear-gradient(to right,{c} 1px,transparent 1px),linear-gradient(to bottom,{c} 1px,transparent 1px)","22px 22px"],
["ph-code","Development","Apex Masterclass","Async Apex & Queueable","07","radial-gradient({c} 1px,transparent 1px)","14px 14px"],
["ph-flow-arrow","Automation","Flow Builder in Practice","Record-Triggered Flows","04","repeating-linear-gradient(45deg,{c} 0 1px,transparent 1px 12px)",null],
["ph-database","Data Cloud","Intro to Data Cloud","Ingesting Streaming Data","05","radial-gradient(circle,transparent 0 8px,{c} 9px 10px,transparent 11px)","70px 70px"],
["ph-medal","Certification","Admin Cert Crash Course","Mock Exam Walkthrough","08","linear-gradient(to right,{c} 1px,transparent 1px)","12px 100%"]
];
function render(id,theme){
  const w=theme==="dark"?"255 255 255":"0 0 30";
  const boost=theme==="dark"?1:1.5;
  const g=document.getElementById(id);
  pairs.forEach(([icon,kick,courseTitle,lessonTitle,idx,img,size])=>{
    const c=`rgb(${w}/${.08*boost})`;
    const pat = img.replaceAll("{c}",c);
    const patStyle=`background-image:${pat};${size?`background-size:${size}`:''}`;
    g.insertAdjacentHTML('beforeend',`<div class="pair">
      <div class="card ${theme}"><div class="bar"></div><div style="position:absolute;inset:0;${patStyle}"></div><i class="ph ${icon} ic"></i><div class="k">${kick}</div><div class="tt">${courseTitle}</div></div>
      <div class="arrow">→</div>
      <div class="card ${theme}"><div class="bar"></div><div style="position:absolute;inset:0;${patStyle}"></div><i class="ph ${icon} ic"></i><div class="k">${courseTitle}</div><div class="tt">${lessonTitle}</div><div class="idx">${idx}</div></div>
    </div>`);
  });
}
render("d","dark");render("l","light");
</script>
</body></html>
