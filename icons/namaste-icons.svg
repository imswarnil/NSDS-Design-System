<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Namaste UI — bespoke LMS icon set.
       ==================================================================
       20 glyphs Phosphor does not cover in this product's own vocabulary:
       lesson types, the roadmap, orgs, Apex, flows, publishing. Drawn on a
       24px grid, 1.7px stroke, round caps/joins — the same optical weight
       as the Phosphor regular subset, so the two sets mix in one row
       without reading as two libraries.

       Use as a sprite reference:
         <svg class="ns-icon" aria-hidden="true"><use href="assets/icons/namaste-icons.svg#ns-i-course"/></svg>
       Sizing and color come from .ns-icon (components/css/icon.css):
       1em square, currentColor stroke — an icon inherits like a letter. -->

  <!-- course: an open book with a bookmark — the catalog unit -->
  <symbol id="ns-i-course" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6.5C10.5 4.9 8 4.2 4 4.2v13.6c4 0 6.5.7 8 2.3 1.5-1.6 4-2.3 8-2.3V4.2c-4 0-6.5.7-8 2.3Z"/>
    <path d="M12 6.5v13.6"/>
    <path d="M17 4.4v5.1l-1.8-1.3-1.8 1.3V4.6"/>
  </symbol>

  <!-- lesson-video: play glyph inside the 16:9 stage -->
  <symbol id="ns-i-lesson-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
    <path d="M10.2 9.3l4.6 2.7-4.6 2.7Z"/>
  </symbol>

  <!-- lesson-reading: an article — headline bar and body lines -->
  <symbol id="ns-i-lesson-reading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="1.5"/>
    <path d="M7.5 8.5h9M7.5 12h9M7.5 15.5h5.5"/>
  </symbol>

  <!-- lesson-quiz: a check inside a question card -->
  <symbol id="ns-i-lesson-quiz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="1.5"/>
    <path d="M9.6 9.6a2.4 2.4 0 1 1 3.3 2.2c-.7.3-.9.8-.9 1.5"/>
    <path d="M12 16.2h.01"/>
  </symbol>

  <!-- lesson-lab: the hands-on flask -->
  <symbol id="ns-i-lesson-lab" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 3.5h5M10.5 3.5v5.2L5.6 17a2.2 2.2 0 0 0 2 3h8.8a2.2 2.2 0 0 0 2-3l-4.9-8.3V3.5"/>
    <path d="M7.5 14.5h9"/>
  </symbol>

  <!-- certificate: the completion rosette -->
  <symbol id="ns-i-certificate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="9.5" r="5.5"/>
    <path d="M9.8 9.3l1.6 1.6 2.8-2.8"/>
    <path d="M9 14.2 7.5 20.5l4.5-2 4.5 2-1.5-6.3"/>
  </symbol>

  <!-- roadmap: the numbered path, waypoint to waypoint -->
  <symbol id="ns-i-roadmap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5.5" cy="5.5" r="2"/>
    <circle cx="18.5" cy="18.5" r="2"/>
    <path d="M7.5 5.5h7a3.5 3.5 0 0 1 0 7h-5a3.5 3.5 0 0 0 0 7h7"/>
  </symbol>

  <!-- module: the stacked section -->
  <symbol id="ns-i-module" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5 20.5 8 12 12.5 3.5 8Z"/>
    <path d="M3.5 12.5 12 17l8.5-4.5"/>
    <path d="M3.5 16.5 12 21l8.5-4.5"/>
  </symbol>

  <!-- dashboard: the console grid, one tile live -->
  <symbol id="ns-i-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="7" height="9" rx="1.2"/>
    <rect x="13.5" y="4" width="6.5" height="5.5" rx="1.2"/>
    <rect x="13.5" y="12" width="6.5" height="8" rx="1.2"/>
    <rect x="4" y="15.5" width="7" height="4.5" rx="1.2"/>
  </symbol>

  <!-- students: two heads, the cohort -->
  <symbol id="ns-i-students" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8.5" r="3.2"/>
    <path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/>
    <path d="M15.5 5.8a3.2 3.2 0 0 1 0 5.9M17.2 14.4a5.5 5.5 0 0 1 3.3 5.1"/>
  </symbol>

  <!-- instructor: a head before the board -->
  <symbol id="ns-i-instructor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="17" height="10" rx="1.2"/>
    <path d="M7 7.5h6M7 10.5h3.5"/>
    <circle cx="16.5" cy="17" r="2.2"/>
    <path d="M12.6 21.5a4.2 4.2 0 0 1 7.8 0"/>
  </symbol>

  <!-- org: the Salesforce org — a cloud with a hairline id row -->
  <symbol id="ns-i-org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.3 16.5a4 4 0 0 1-.5-7.9 5.2 5.2 0 0 1 10-1 3.8 3.8 0 0 1 .5 7.5"/>
    <path d="M8 19.5h8"/>
  </symbol>

  <!-- apex: code braces around a dot — the language -->
  <symbol id="ns-i-apex" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 4.5c-2 0-2.5 1-2.5 2.5v2c0 1.6-.6 2.6-2.2 3 1.6.4 2.2 1.4 2.2 3v2c0 1.5.5 2.5 2.5 2.5"/>
    <path d="M15.5 4.5c2 0 2.5 1 2.5 2.5v2c0 1.6.6 2.6 2.2 3-1.6.4-2.2 1.4-2.2 3v2c0 1.5-.5 2.5-2.5 2.5"/>
    <path d="M12 12h.01"/>
  </symbol>

  <!-- flow: three nodes, one decision -->
  <symbol id="ns-i-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="2.2"/>
    <path d="M12 9.8 14.2 12 12 14.2 9.8 12Z"/>
    <circle cx="18" cy="18" r="2.2"/>
    <path d="M7.6 7.6l2.6 2.6M13.8 13.8l2.6 2.6"/>
  </symbol>

  <!-- data: the record store -->
  <symbol id="ns-i-data" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5.8" rx="7" ry="2.8"/>
    <path d="M5 5.8v12.4c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V5.8"/>
    <path d="M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>
  </symbol>

  <!-- publish: up and out of the tray -->
  <symbol id="ns-i-publish" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 14.5v-10M8.2 8.2 12 4.4l3.8 3.8"/>
    <path d="M4.5 15.5v3a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-3"/>
  </symbol>

  <!-- draft: the pencil over the row -->
  <symbol id="ns-i-draft" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m14.5 5.5 4 4L9 19H5v-4Z"/>
    <path d="M12.5 7.5l4 4"/>
    <path d="M4.5 21.5h15"/>
  </symbol>

  <!-- analytics: three bars on a baseline, tallest last -->
  <symbol id="ns-i-analytics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/>
    <path d="M7 20v-5M12 20V9M17 20V4.5"/>
  </symbol>

  <!-- progress-ring: the meter, three-quarters done -->
  <symbol id="ns-i-progress-ring" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4a8 8 0 1 1-8 8"/>
    <path d="M12 8.5V12l2.5 2.5"/>
  </symbol>

  <!-- trailhead: the trail marker — where a path starts -->
  <symbol id="ns-i-trailhead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5 5.5 8v6.5L12 19l6.5-4.5V8Z"/>
    <path d="M12 19v2.5"/>
    <path d="M9.5 11.5 12 9l2.5 2.5M12 9v5"/>
  </symbol>
</svg>
